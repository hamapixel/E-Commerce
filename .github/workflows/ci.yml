name: SUGU KURA CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Django
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sugu_kura_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: sugu_kura_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      APP_TIME_ZONE: Africa/Bamako
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/lock.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements/lock.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Check missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        working-directory: backend
        run: python manage.py test

  owner:
    name: OWNER Next.js
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      INTERNAL_API_URL: http://127.0.0.1:8000/api/v1
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/owner/package-lock.json

      - name: Install OWNER dependencies
        working-directory: apps/owner
        run: npm ci

      - name: Lint OWNER
        working-directory: apps/owner
        run: npm run lint

      - name: Build OWNER
        working-directory: apps/owner
        run: npm run build

  storefront:
    name: Storefront Next.js
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      INTERNAL_API_URL: http://127.0.0.1:8000/api/v1
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json

      - name: Install storefront dependencies
        working-directory: apps/storefront
        run: npm ci

      - name: Lint storefront
        working-directory: apps/storefront
        run: npm run lint

      - name: Build storefront
        working-directory: apps/storefront
        run: npm run build
